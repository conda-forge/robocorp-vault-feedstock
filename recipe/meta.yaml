{% set name = "robocorp-vault" %}
{% set version = "1.4.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/robocorp_vault-{{ version }}.tar.gz
  sha256: ab4b41dae5b2a305ef6b4ab70b5049c463190445680494003351fdfcabd96159

build:
  noarch: python
  script:
    - echo f | xcopy /f /y /S %RECIPE_DIR%\README.md %SRC_DIR%\README.md  # [win]
    - cp -R {{ RECIPE_DIR }}/README.md {{ SRC_DIR }}/README.md  # [unix]
    - {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - poetry-core
    - pip
  run:
    - python >={{ python_min }},<4.0.0
    - cryptography >=46.0.5
    - requests >=2.28.2
    - pyyaml >=6.0.0,<7.0.0
    - tenacity >=8.0.1

test:
  imports:
    - robocorp.vault
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/robocorp/robo/
  summary: Robocorp Control Room Vault API integration library
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - rxm7706
